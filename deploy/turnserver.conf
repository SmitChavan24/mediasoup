# coturn config — FALLBACK TURN for the mediasoup VoIP server.
# Install: sudo apt install coturn   (enable in /etc/default/coturn: TURNSERVER_ENABLED=1)
# Place this at /etc/turnserver.conf
#
# Co-located with mediasoup on the same instance. TURN is only used when a client
# cannot do direct UDP, so the transports that matter are TCP (3478) and TLS (5349).

# ── Listening ─────────────────────────────────────────────────────────────────
listening-port=3478
tls-listening-port=5349

# Bind to all interfaces; advertise the PUBLIC IP to clients.
listening-ip=0.0.0.0
external-ip=13.201.61.128        # <-- instance public IP (= PUBLIC_IP in server/.env)

realm=turn.tglevels.in
server-name=turn.tglevels.in

# ── Auth (long-term credentials) ──────────────────────────────────────────────
# Must match TURN_USERNAME / TURN_CREDENTIAL in server/.env.
# TODO: replace with a strong secret before going live.
lt-cred-mech
user=turnuser:CHANGE_ME_STRONG_SECRET

# ── TLS cert (reuse certbot; needs a domain pointing at this instance) ─────────
cert=/etc/letsencrypt/live/turn.tglevels.in/fullchain.pem
pkey=/etc/letsencrypt/live/turn.tglevels.in/privkey.pem

# ── Relay port range (internal — coturn relays to mediasoup over the host) ─────
# Kept distinct from the mediasoup RTC range (40000-49999) for cleanliness.
min-port=50000
max-port=51000

# ── IMPORTANT co-location gotcha ──────────────────────────────────────────────
# coturn denies relaying to private/loopback peers by default. The media peer
# here is mediasoup on the SAME host. mediasoup announces the public IP
# (external-ip), so peers resolve to the public IP and are allowed. If you see
# relayed media fail, allow the instance's own subnet explicitly, e.g.:
# allowed-peer-ip=<instance-private-ip>

# ── Hardening ─────────────────────────────────────────────────────────────────
fingerprint
no-multicast-peers
no-cli

allowed-peer-ip=172.31.1.128
# Block relaying to internal ranges you don't want reachable via TURN:
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
