# nginx reverse proxy for the mediasoup signaling server (Socket.IO / WSS).
# Place in /etc/nginx/sites-available/ and symlink into sites-enabled.
# Run certbot for the cert:  sudo certbot --nginx -d voip.tglevels.in
#
# NOTE: this proxies ONLY the signaling channel (HTTP + WebSocket on :3005).
# WebRTC MEDIA does NOT flow through nginx — it goes directly over the mediasoup
# UDP RTC port range to the instance public IP. Those ports must be open in the
# AWS security group, NOT proxied here.

server {
    listen 443 ssl http2;
    server_name voip.tglevels.in;

    ssl_certificate     /etc/letsencrypt/live/voip.tglevels.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voip.tglevels.in/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;

        # WebSocket upgrade (required for Socket.IO)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Socket.IO long-poll / idle connections
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }
}

server {
    listen 80;
    server_name voip.tglevels.in;
    return 301 https://$host$request_uri;
}

