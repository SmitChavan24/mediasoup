server {
    server_name pwaagent.tglevels.in;

    root /home/ubuntu/mediasoup/agent-pwa/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pwaagent.tglevels.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pwaagent.tglevels.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = pwaagent.tglevels.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name pwaagent.tglevels.in;
    return 404; # managed by Certbot


}